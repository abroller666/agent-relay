[package]
name = "agent-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hand an AI agent's last finished answer, plus your instruction, to the AI in another Herdr pane"
license = "MIT"
publish = false

[dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.20.0"
